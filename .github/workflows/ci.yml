name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand, for example after the baseline workflow commits new screenshots.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tokens, types, lint, contrast, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Tokens are built from source
        run: |
          pnpm build:tokens
          git diff --exit-code -- packages/tokens || (echo "::error::Token outputs are stale. Run pnpm build:tokens and commit." && exit 1)

      - name: Agent docs and manifest are up to date
        run: |
          pnpm build:agent
          git diff --exit-code -- DESIGN.md llms.txt components.manifest.json || (echo "::error::Agent docs are stale. Run pnpm build:agent and commit." && exit 1)

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:copy
      - name: Documentation examples compile
        run: pnpm check:examples
      - run: pnpm check:docs-tokens
      - run: pnpm check:coverage
      - run: pnpm check:links
      - name: Demo app production build
        run: pnpm --filter @leeward/demo build

      - name: Contrast report (WCAG 2.2 AA gate, APCA reported)
        run: pnpm contrast

      - run: pnpm test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: contrast-report
          path: docs/contrast-report.md

  packages:
    name: npm packages work when installed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Packs each package as npm would publish it, installs the tarballs into a clean project
      # with plain npm, then type checks and builds a React app, uses the tokens, runs the lint
      # rules and starts the MCP server.
      - run: pnpm smoke:packages

  stories:
    name: Story tests and axe (light, dark, partner)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @leeward/docs exec playwright install --with-deps chromium
      - run: pnpm test:stories
      # The demo app: every screen in every brand and mode with axe, and the transfer flow.
      - run: pnpm --filter @leeward/app test:e2e

  visual:
    name: Visual regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @leeward/docs exec playwright install --with-deps chromium
      - run: pnpm --filter @leeward/docs build-storybook
      # Missing baselines are written, not failed, so a new story does not block CI.
      # The "Update visual baselines" workflow commits them.
      - run: pnpm --filter @leeward/docs exec playwright test --update-snapshots=missing
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-report
          path: |
            apps/docs/playwright-report
            apps/docs/test-results
