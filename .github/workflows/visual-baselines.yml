name: Update visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @leeward/docs exec playwright install --with-deps chromium
      - run: pnpm --filter @leeward/docs build-storybook
      - run: pnpm --filter @leeward/docs exec playwright test --update-snapshots=all
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/docs/visual/__screenshots__/linux
          git diff --cached --quiet || git commit -m "test(visual): update Linux baselines"
          git push
